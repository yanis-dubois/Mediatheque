<button class="dropdown-button" (click)="openPicker($event)">
  Organize pins
</button>

<hr class="dropdown-separator">

<app-collections-action></app-collections-action>

<button class="dropdown-button" (click)="addMedia()">
  + Add Media Manually
</button>

<div #pickerPopover popover="manual" class="picker-popover-wrapper">
  @if (isPickerVisible()) {
    <app-pin-organizer 
      (onCancel)="closePicker()" 
      (onSave)="closePicker()"
    />
  }
</div>

<div #editorPopover popover="manual" class="picker-popover-wrapper">
  @if (isEditorVisible()) {
    <app-media-editing
      [mediaId]="mediaId()!"
      (onCancel)="closeEditor()"
      (onConfirm)="closeEditor(); editMedia($event);"
    />
  }
</div>
